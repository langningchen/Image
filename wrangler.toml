name = "vanishpic"
main = "custom-worker.ts"
compatibility_date = "2026-07-29"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "image-data"

[[d1_databases]]
binding = "DB"
database_name = "image-metadata"
# `pnpm deploy:setup` creates or reuses the database and updates this value.
database_id = "610fecd3-e9b3-4bc1-ae5c-e9ce574e299b"
migrations_dir = "migrations"

[secrets]
required = [
  "ADMIN_PASSWORD",
  "SESSION_SECRET",
  "IP_HASH_SECRET",
  "CONFIG_ENCRYPTION_KEY",
]

[vars]
DEMO_MODE = "false"
MAX_UPLOAD_MIB = "10"

[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]
