name = "image"
main = "src/index.ts"
compatibility_date = "2024-07-01"

[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[placement]
mode = "smart"

[triggers]
crons = ["17 3 * * *"]

# Create this namespace with `npx wrangler kv namespace create IMAGE_ACCESS`,
# then uncomment the binding and replace the ID before deploying.
[[kv_namespaces]]
binding = "IMAGE_ACCESS"
id = "518176d41958459fb0f28b1e211760fd"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
